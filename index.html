<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lantern Lancers</title>
  <link rel="icon" href="assets/icon.jpg" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #07060d;
      color: #fff6e4;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100%;
    }
    canvas {
      display: block;
      background: #07060d;
      box-shadow: 0 0 80px rgba(255, 180, 70, 0.14);
      max-width: 100vw;
      max-height: 100vh;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Lantern Lancers</h1>
  <canvas id="view" width="960" height="540" tabindex="0" aria-label="Lantern Lancers playfield"></canvas>
  <p id="status" class="sr-only"></p>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
